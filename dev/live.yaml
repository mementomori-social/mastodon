# Production mode: CI's image of this branch with RAILS_ENV=production, on the
# same database, Redis and media as dev mode. bin/mementomori-dev up live
# turns it on. Relative paths resolve from .devcontainer/.
x-live: &live
  image: ghcr.io/mementomori-social/mastodon:${LIVE_TAG:-latest}
  profiles: [live]
  restart: unless-stopped
  env_file:
    # Same Active Record encryption keys as dev mode, so both read the same data
    - ../.env.development
    # SECRET_KEY_BASE and VAPID keys, generated by bin/mementomori-dev
    - path: ../dev/live.env
      required: false
  environment:
    RAILS_ENV: production
    NODE_ENV: production
    LOCAL_DOMAIN: mementomori.test${DEV_PORT_SUFFIX:-}
    STREAMING_API_BASE_URL: wss://mementomori.test${DEV_PORT_SUFFIX:-}
    DB_HOST: db
    DB_PORT: '5432'
    DB_USER: postgres
    DB_PASS: postgres
    DB_NAME: mastodon_development
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    ES_ENABLED: ${ES_ENABLED:-false}
    ES_HOST: es
    ES_PORT: '9200'
    LIBRE_TRANSLATE_ENDPOINT: ${LIBRE_TRANSLATE_ENDPOINT:-}
    EXPERIMENTAL_FEATURES: inbound_quotes,outgoing_quotes,modern_emojis,wrapstodon
    MASTODON_VERSION_METADATA: live
    # No mail server: messages are written to tmp/mails in the container
    SMTP_DELIVERY_METHOD: file
  security_opt: [label=disable]
  volumes:
    - ../public/system:/opt/mastodon/public/system
  networks:
    - external_network
    - internal_network
  depends_on:
    - db
    - redis

services:
  web:
    <<: *live
    command: bundle exec puma -C config/puma.rb

  streaming:
    <<: *live
    image: ghcr.io/mementomori-social/mastodon-streaming:${LIVE_TAG:-latest}
    command: node ./streaming/index.js

  sidekiq:
    <<: *live
    command: bundle exec sidekiq
