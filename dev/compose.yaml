# mementomori.test on any machine. Layered over upstream's dev stack:
#   docker compose -f .devcontainer/compose.yaml -f dev/compose.yaml ...
# bin/mementomori-dev wraps this. Relative paths resolve from .devcontainer/.
name: mementomori-dev

services:
  app:
    profiles: [dev]
    user: vscode
    environment:
      LOCAL_DOMAIN: mementomori.test${DEV_PORT_SUFFIX:-}
      LOCAL_HTTPS: 'true'
      STREAMING_API_BASE_URL: wss://mementomori.test${DEV_PORT_SUFFIX:-}
      ES_ENABLED: ${ES_ENABLED:-false}
      LIBRE_TRANSLATE_ENDPOINT: ${LIBRE_TRANSLATE_ENDPOINT:-}
      EXPERIMENTAL_FEATURES: inbound_quotes,outgoing_quotes,modern_emojis,wrapstodon
      REMOTE_DEV: 'true'
      # Vite refuses unknown Host headers with 403, which breaks /packs-dev behind Caddy.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: mementomori.test
      BUNDLE_PATH: vendor/bundle
    command: bash -lc dev/start.sh
    # dev/start.sh prepares the database, so a new db container needs a new run
    depends_on:
      db:
        condition: service_started
        restart: true
    ports: !reset
      - 127.0.0.1:3036:3036
    healthcheck:
      test: curl -fsS http://localhost:3000/health
      interval: 10s
      start_period: 15m

  # Production runs 18. The 18 image keeps its data one level up, and the
  # volume is new so an existing 14 database is left alone.
  db:
    image: postgres:18-alpine
    volumes: !override
      - postgres18-data:/var/lib/postgresql

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      WEB_UPSTREAM: ${WEB_UPSTREAM:-app:3000}
      STREAMING_UPSTREAM: ${STREAMING_UPSTREAM:-app:4000}
    ports:
      - 127.0.0.1:${HTTPS_PORT:-443}:443
    volumes:
      - ../dev/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../dev/certs:/certs:ro
      - caddy-data:/data
    networks:
      - external_network

  es:
    profiles: [search]
    environment:
      # The 8.x image defaults to TLS and auth; Mastodon's dev config speaks plain HTTP.
      xpack.security.enabled: 'false'

  libretranslate:
    profiles: [translate]

volumes:
  caddy-data:
  postgres18-data:
