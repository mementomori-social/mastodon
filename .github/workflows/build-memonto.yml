name: Build mementomods container image
on:
  workflow_dispatch:
  push:
      branches:
        - mementomods-*

permissions:
  contents: read
  packages: write

jobs:
  compute-suffix:
    runs-on: ubuntu-latest
    if: github.repository == 'mementomori-social/mastodon'
    steps:
      - id: version_vars
        run: |
          # Sanitize the branch name (e.g. "feature/foo" -> "feature-foo") so it is a valid tag/version
          branch="${GITHUB_REF_NAME//\//-}"
          echo "mastodon_version_prerelease=${branch}" >> $GITHUB_OUTPUT
    outputs:
      prerelease: ${{ steps.version_vars.outputs.mastodon_version_prerelease }}

  build-image:
    needs: compute-suffix
    uses: ./.github/workflows/build-container-image.yml
    with:
      file_to_build: Dockerfile
      push_to_images: |
        ghcr.io/mementomori-social/mastodon
      version_prerelease: ${{ needs.compute-suffix.outputs.prerelease }}
      labels: |
        org.opencontainers.image.description=mementomods build image
      flavor: |
        latest=auto
      tags: |
        type=raw,value=latest
        type=raw,value=${{ needs.compute-suffix.outputs.prerelease }}
    secrets: inherit

  build-image-streaming:
    needs: compute-suffix
    uses: ./.github/workflows/build-container-image.yml
    with:
      file_to_build: streaming/Dockerfile
      push_to_images: |
        ghcr.io/mementomori-social/mastodon-streaming
      version_prerelease: ${{ needs.compute-suffix.outputs.prerelease }}
      labels: |
        org.opencontainers.image.description=mementomods build image
      flavor: |
        latest=auto
      tags: |
        type=raw,value=latest
        type=raw,value=${{ needs.compute-suffix.outputs.prerelease }}
    secrets: inherit
